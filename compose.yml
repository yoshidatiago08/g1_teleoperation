# g1tele. Two roles, normally on two machines:
#   robot host (VM):   docker compose --profile robot up --build
#   operator machine:  docker compose --profile operator up --build        (or: pip install -e ".[perception]")
# Settings live in configs/*.yaml and can be overridden with G1TELE_ARGS, e.g.
#   G1TELE_ARGS="--set robot.backend=dds --set robot.dds_interface=lo"
services:
  robot:
    profiles: [robot]
    build: {context: ., dockerfile: docker/Dockerfile.g1tele, target: robot}
    image: g1tele:robot
    # host networking: the link ports (5555-5557) and, for the DDS backend, DDS discovery
    network_mode: host
    command: sh -c "g1tele-robot --config /app/configs/default.yaml $${G1TELE_ARGS}"
    volumes: ["./recordings:/app/recordings", "./configs:/app/configs"]
    environment: [G1TELE_ARGS]
    init: true

  operator:
    profiles: [operator]
    build: {context: ., dockerfile: docker/Dockerfile.g1tele, target: operator}
    image: g1tele:operator
    network_mode: host
    privileged: true                 # raw USB access to the RealSense
    command: sh -c "g1tele-perception --config /app/configs/default.yaml $${G1TELE_ARGS}"
    volumes: ["/dev:/dev", "/run/udev:/run/udev:ro", "/tmp/.X11-unix:/tmp/.X11-unix:rw",
              "./profiles:/app/profiles", "./configs:/app/configs"]
    environment: [G1TELE_ARGS, "DISPLAY=${DISPLAY:-:0}", QT_X11_NO_MITSHM=1]
    init: true
