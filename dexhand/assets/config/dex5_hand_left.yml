# dex-retargeting config for the Unitree Dex5-1 hand (left), vector retargeting: the wrist -> fingertip vectors of your hand are
# matched by the robot hand's wrist -> fingertip vectors. Generated by tools/make_dex5_assets.py.
# 16 actuated joints (thumb 4, and abduction + 2 flexions for each long finger); the distal joints follow the middle ones (<mimic>).
# Both the human vectors and the URDF are expressed in the robot hand's base link (dex_hand.retarget), so no MANO rotation is needed.
retargeting:
  type: vector
  urdf_path: dex5_hand_left.urdf

  target_joint_names: [ 'L_thumb_yaw_joint', 'L_thumb_roll_joint', 'L_thumb_mcp_joint', 'L_thumb_ip_joint', 'L_index_abduction_joint', 'L_index_mcp_joint', 'L_index_pip_joint', 'L_middle_abduction_joint', 'L_middle_mcp_joint', 'L_middle_pip_joint', 'L_ring_abduction_joint', 'L_ring_mcp_joint', 'L_ring_pip_joint', 'L_pinky_abduction_joint', 'L_pinky_mcp_joint', 'L_pinky_pip_joint' ]
  target_origin_link_names: [ 'L_hand_base_link', 'L_hand_base_link', 'L_hand_base_link', 'L_hand_base_link', 'L_hand_base_link' ]
  target_task_link_names: [ 'L_thumb_tip', 'L_index_tip', 'L_middle_tip', 'L_ring_tip', 'L_pinky_tip' ]
  # Robot fingers vs yours: 1.0 = same length. This is NOT the hand motion scale. 'auto' (the default) measures it at the calibration.
  scaling_factor: 1.0

  # (origin, task) MediaPipe landmark per vector: wrist -> each fingertip
  target_link_human_indices: [ [ 0, 0, 0, 0, 0 ], [ 4, 8, 12, 16, 20 ] ]

  low_pass_alpha: 0.2
